name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm docs:build

      - name: Package build
        run: |
          tar -czf site.tar.gz -C docs/.vuepress/dist .
          git rev-parse HEAD > version.txt
          echo "Build package:"
          ls -lh site.tar.gz version.txt

      - name: Install Tencent COS SDK
        run: python -m pip install --upgrade cos-python-sdk-v5

      - name: Upload build package to COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_ENDPOINT: ${{ secrets.COS_ENDPOINT }}
        run: python .github/scripts/upload_cos.py
